name: ESP32-S3 Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4
          target: esp32s3
          path: '.'

      - name: Prepare ELF
        run: |
          mkdir -p firmware
          cp build/esp-idf-hello-world.elf firmware/

          echo "ELF:"
          ls -lh firmware/

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: firmware/esp-idf-hello-world.elf
